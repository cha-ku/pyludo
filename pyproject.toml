[project]
name = "pyludo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chaitanya Kukde", email = "ckukde@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.2",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pyludo = "pyludo:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pyludo", "helpers"]
