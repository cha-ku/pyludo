volumes: {caddy_data: {}}

services:
  pyludo:
    build: .
    environment:
      PYLUDO_TURN_SECONDS: "30"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:800/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 5s

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
